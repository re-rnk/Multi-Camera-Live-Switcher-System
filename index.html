<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Multi-Camera-Live-Switcher-System</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    
    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
    }
    .active { display: flex; }

    /* 初期選択画面 */
    #mode-select {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background-color: #121214;
      padding: 20px;
      text-align: center;
    }
    #mode-select h1 {
      font-size: clamp(20px, 5vw, 32px);
      word-break: break-word;
      max-width: 90vw;
    }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 80vw;
      max-width: 320px;
    }
    .btn-gray { background: #4b5563; }
    .btn-red { background: #ef4444; }

    /* 送信機画面 */
    #sender-screen {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #1a1a1e;
      gap: 12px;
      padding: 16px;
    }
    #sender-screen h2 {
      font-size: clamp(16px, 4vw, 24px);
    }
    select {
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      width: 80vw;
      max-width: 320px;
    }
    #sender-preview-container {
      position: relative;
      width: 90vw;
      height: 45vh;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #sender-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status-text {
      font-size: 14px;
      color: #60a5fa;
      text-align: center;
    }
    .sender-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 80vw;
      max-width: 320px;
    }
    .sender-btn-group .btn {
      width: 100%;
      max-width: 100%;
      padding: 12px;
      font-size: 16px;
    }

    /* 受信機画面 */
    #receiver-screen {
      position: relative;
      background: #000;
    }
    #main-video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    /* ESCメニュー・マルチビュー画面 */
    #menu-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
    }
    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      flex: 1;
      overflow-y: auto;
    }
    .grid-item {
      position: relative;
      background: #18181b;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 16/9;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .grid-item.active-cam {
      border-color: #3b82f6;
    }
    .grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .grid-item .label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.7);
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- 1. モード選択画面 -->
  <div id="mode-select" class="screen">
    <h1>Multi-Camera<br>Live-Switcher-System</h1>
    <button class="btn" id="btn-to-sender">送信機として接続</button>
    <button class="btn btn-gray" id="btn-to-receiver">受信機として接続</button>
  </div>

  <!-- 2. 送信機画面 -->
  <div id="sender-screen" class="screen">
    <h2>カメラ番号を選択してください</h2>
    <select id="camera-number">
      <option value="1">カメラ 1</option>
      <option value="2">カメラ 2</option>
      <option value="3">カメラ 3</option>
      <option value="4">カメラ 4</option>
      <option value="5">カメラ 5</option>
    </select>
    <button class="btn" id="btn-start-camera">カメラ起動・配信開始</button>
    <div class="status-text" id="sender-status"></div>
    <div id="sender-preview-container">
      <video id="sender-video" autoplay playsinline muted></video>
    </div>
    <div class="sender-btn-group">
      <button class="btn btn-gray" id="btn-fullscreen">全画面表示</button>
      <button class="btn btn-red" id="btn-sender-back">最初の画面に戻る</button>
    </div>
  </div>

  <!-- 3. 受信機画面 -->
  <div id="receiver-screen" class="screen">
    <video id="main-video" autoplay playsinline></video>

    <!-- ESCキーメニュー / マルチビュー -->
    <div id="menu-overlay">
      <div class="menu-header">
        <h2>マルチビュー・メニュー</h2>
        <button class="btn btn-red" id="btn-receiver-back" style="width: auto;">最初の画面に戻る</button>
      </div>
      <div class="grid-view" id="grid-container"></div>
    </div>
  </div>

  <script>
    const SYSTEM_PREFIX = "mcls-v5-";

    const screens = {
      select: document.getElementById('mode-select'),
      sender: document.getElementById('sender-screen'),
      receiver: document.getElementById('receiver-screen')
    };

    function showScreen(key) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[key].classList.add('active');
    }

    /* 起動時パスワード確認 */
    window.addEventListener('DOMContentLoaded', () => {
      let auth = false;
      while (!auth) {
        const input = prompt("パスワードを入力してください");
        if (input === "4750") {
          auth = true;
          showScreen('select');
        } else if (input === null) {
          alert("パスワードが必要です");
        } else {
          alert("パスワードが違います");
        }
      }
    });

    document.getElementById('btn-to-sender').addEventListener('click', () => showScreen('sender'));
    document.getElementById('btn-to-receiver').addEventListener('click', () => {
      showScreen('receiver');
      initReceiver();
    });

    document.getElementById('btn-sender-back').addEventListener('click', () => {
      stopSender();
      showScreen('select');
    });

    document.getElementById('btn-receiver-back').addEventListener('click', () => {
      stopReceiver();
      document.getElementById('menu-overlay').style.display = 'none';
      showScreen('select');
    });

    /* 全画面表示処理 */
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      const video = document.getElementById('sender-video');
      const container = document.getElementById('sender-preview-container');
      
      if (video.requestFullscreen) {
        video.requestFullscreen();
      } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
      } else if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      }
    });

    /* ===================================================
       送信機（スマホ）側処理
    =================================================== */
    let localStream = null;
    let senderPeer = null;

    document.getElementById('btn-start-camera').addEventListener('click', async () => {
      const selectedNo = document.getElementById('camera-number').value;
      const statusEl = document.getElementById('sender-status');
      statusEl.textContent = "カメラ起動中...";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        document.getElementById('sender-video').srcObject = localStream;

        const myPeerId = SYSTEM_PREFIX + "cam-" + selectedNo;
        if (senderPeer) senderPeer.destroy();

        senderPeer = new Peer(myPeerId);

        senderPeer.on('open', () => {
          statusEl.textContent = `配信中: カメラ ${selectedNo} (受信機の接続を待っています)`;
        });

        // 受信機からの着信要求にカメラストリームを返答
        senderPeer.on('call', (call) => {
          call.answer(localStream);
          statusEl.textContent = `配信中: カメラ ${selectedNo} (受信機へ映像送信中)`;
        });

        senderPeer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            alert(`カメラ ${selectedNo} はすでに起動しています。`);
          } else {
            console.warn("Sender error:", err.type);
          }
        });

      } catch (err) {
        alert("カメラの起動に失敗しました: " + err.message);
        statusEl.textContent = "";
      }
    });

    function stopSender() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (senderPeer) {
        senderPeer.destroy();
        senderPeer = null;
      }
      document.getElementById('sender-status').textContent = "";
    }

    /* ===================================================
       受信機（PC）側処理（5台対応＆ダミーストリーム接続）
    =================================================== */
    let receiverPeer = null;
    let currentCam = 1;
    const cameraStreams = {};
    const connectingSet = new Set();
    let pollingTimer = null;
    const menuOverlay = document.getElementById('menu-overlay');

    // 通信確立用のダミーストリーム生成関数
    function createDummyStream() {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const dst = ctx.createMediaStreamDestination();
      osc.connect(dst);
      osc.start();
      const audioTrack = dst.stream.getAudioTracks()[0];
      audioTrack.enabled = false; // 消音状態

      const canvas = document.createElement('canvas');
      canvas.width = 16; canvas.height = 16;
      const canvasStream = canvas.captureStream();
      
      return new MediaStream([canvasStream.getVideoTracks()[0], audioTrack]);
    }

    function initReceiver() {
      if (receiverPeer) receiverPeer.destroy();
      
      receiverPeer = new Peer();

      receiverPeer.on('open', () => {
        startPollingCameras();
      });
    }

    function startPollingCameras() {
      if (pollingTimer) clearInterval(pollingTimer);
      
      // 1.5秒周期で 1〜5番のカメラへ接続チェック
      pollingTimer = setInterval(() => {
        for (let i = 1; i <= 5; i++) {
          if (!cameraStreams[i] && !connectingSet.has(i)) {
            connectToCam(i);
          }
        }
      }, 1500);
    }

    function connectToCam(num) {
      const targetId = SYSTEM_PREFIX + "cam-" + num;
      connectingSet.add(num);

      const dummyStream = createDummyStream();
      const call = receiverPeer.call(targetId, dummyStream);

      if (!call) {
        connectingSet.delete(num);
        return;
      }

      call.on('stream', (remoteStream) => {
        cameraStreams[num] = remoteStream;
        connectingSet.delete(num);
        if (num === currentCam) {
          switchCamera(num);
        }
        updateGridView();
      });

      call.on('close', () => {
        delete cameraStreams[num];
        connectingSet.delete(num);
        if (num === currentCam) switchCamera(num);
        updateGridView();
      });

      call.on('error', () => {
        delete cameraStreams[num];
        connectingSet.delete(num);
      });

      // タイムアウト保護（3秒経ってもストリームが届かなければクリア）
      setTimeout(() => {
        if (connectingSet.has(num) && !cameraStreams[num]) {
          connectingSet.delete(num);
        }
      }, 3000);
    }

    function switchCamera(num) {
      currentCam = num;
      const mainVideo = document.getElementById('main-video');

      if (cameraStreams[num]) {
        mainVideo.srcObject = cameraStreams[num];
      } else {
        mainVideo.srcObject = null;
      }
    }

    function stopReceiver() {
      if (pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
      }
      if (receiverPeer) {
        receiverPeer.destroy();
        receiverPeer = null;
      }
      Object.keys(cameraStreams).forEach(key => delete cameraStreams[key]);
      connectingSet.clear();
    }

    window.addEventListener('keydown', (e) => {
      if (!screens.receiver.classList.contains('active')) return;

      // キーボードの 1〜5 キーに対応
      if (e.key >= '1' && e.key <= '5') {
        switchCamera(parseInt(e.key, 10));
      }

      if (e.key === 'Escape') {
        const isMenuOpen = menuOverlay.style.display === 'flex';
        menuOverlay.style.display = isMenuOpen ? 'none' : 'flex';
        if (!isMenuOpen) {
          updateGridView();
        }
      }
    });

    function updateGridView() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      // 1〜5番カメラのグリッドを動的生成
      for (let i = 1; i <= 5; i++) {
        const item = document.createElement('div');
        item.className = `grid-item ${i === currentCam ? 'active-cam' : ''}`;
        
        const video = document.createElement('video');
        video.autoplay = true;
        video.playsinline = true;
        video.muted = true;

        if (cameraStreams[i]) {
          video.srcObject = cameraStreams[i];
        }

        item.appendChild(video);

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `カメラ ${i} ${cameraStreams[i] ? '' : '(未接続)'}`;
        item.appendChild(label);

        item.addEventListener('click', () => {
          switchCamera(i);
          menuOverlay.style.display = 'none';
        });

        container.appendChild(item);
      }
    }
  </script>
</body>
</html>
